<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background: #101216;
      color: #f4f5f7;
      font-family: Arial, sans-serif;
    }

    .product-card {
      width: min(100%, 900px);
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      overflow: hidden;
      border: 1px solid #292d35;
      border-radius: 20px;
      background: #1a1d23;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .product-image {
      width: 100%;
      height: 100%;
      min-height: 420px;
      object-fit: cover;
      background: #252932;
    }

    .product-details {
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #9ca6b5;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.1;
    }

    .price {
      margin: 0 0 20px;
      color: #fff;
      font-size: 1.7rem;
      font-weight: 700;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      color: #c1c7d0;
      font-size: 0.95rem;
    }

    .stars {
      color: #ffc14d;
      font-size: 1.25rem;
      letter-spacing: 2px;
    }

    .home-button {
      width: fit-content;
      padding: 12px 22px;
      border-radius: 8px;
      background: #f4f5f7;
      color: #17191e;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .home-button:hover {
      background: #d5d9e0;
      transform: translateY(-2px);
    }

    @media (max-width: 650px) {
      .product-card {
        grid-template-columns: 1fr;
      }

      .product-image {
        min-height: 280px;
        max-height: 360px;
      }

      .product-details {
        padding: 32px 26px;
      }
    }
  </style>
</head>
<body>
  <main class="product-card">
    {% for id, name, image_url, price, rating, rating_count in product %}
    <img
      class="product-image"
      src="{{ image_url }}"
      alt="Black and orange over-ear headphones"
    >

    <section class="product-details" aria-labelledby="product-name">
      <h1 id="product-name">{{ name }}</h1>
      <p class="price">{{ price }}</p>

      <div class="rating" aria-label="Rated {{ product.raiting }} out of 5 from { product.raiting-count } reviews">
        <span>{{ rating }} · {{ rating_count }} ratings</span>
      </div>

      <a class="home-button" href="/">Home</a>
    </section>
    {% endfor %}
  </main>
</body>
</html>
